services:
    django:
        build:
            context: ./backend
            dockerfile: Dockerfile

        ports:
            - '8000:8000'

        volumes:
            - ./backend:/app/backend
        env_file:
            - ./backend/src/.env

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile

        ports:
            - '3000:3000'

        volumes:
            - ./frontend:/app/frontend

        depends_on:
            - 'django'
