databases:
  - name: studymate-db-yeraliyeeev
    plan: free
    region: frankfurt
    databaseName: studymate
    user: studymate

services:
  - type: web
    name: studymate-api-yeraliyeeev
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir src project.wsgi:application
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db-yeraliyeeev
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://studymate-yeraliyeeev.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://studymate-yeraliyeeev.onrender.com

  - type: web
    name: studymate-yeraliyeeev
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_URL
        value: https://studymate-api-yeraliyeeev.onrender.com/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
